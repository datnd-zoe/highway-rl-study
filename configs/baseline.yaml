# configs/baseline.yaml
# Cấu hình môi trường dùng để chạy baseline agents (Random và Defensive Driver).
# Baseline không train, chỉ evaluate → không có phần [train].
# Dùng cùng env config với ppo_mid để kết quả có thể so sánh trực tiếp.
# Lưu ý: collision_reward ở đây KHÔNG ảnh hưởng quyết định của baseline agents
#         (chúng không dùng reward), chỉ ảnh hưởng mean_reward ghi vào CSV.

meta:
  name: "baseline"
  description: "Baseline agents (Random + Defensive Driver) on standard env"

env:
  id: "highway-v0"
  # --- Reward components (giống ppo_mid để so sánh mean_reward công bằng) ---
  collision_reward: -5.0        # Phạt va chạm
  right_lane_reward: 0.1        # Thưởng ở lane phải
  high_speed_reward: 0.4        # Thưởng tốc độ cao
  lane_change_reward: 0.0       # Không thưởng/phạt đổi làn
  normalize_reward: false       # TẮT normalize để reward không bị méo
  reward_speed_range: [20, 30]  # Tốc độ [min, max] để map high_speed_reward
  # --- Môi trường ---
  lanes_count: 4
  vehicles_count: 50
  duration: 40                  # [giây] độ dài mỗi episode
  ego_spacing: 2
  vehicles_density: 1
  offroad_terminal: false
  # --- Observation ---
  observation:
    type: "Kinematics"
    vehicles_count: 5           # Quan sát 5 xe gần nhất (bao gồm ego)
    features: ["presence", "x", "y", "vx", "vy"]
    normalize: true

eval:
  n_episodes: 50               # Số episode đánh giá
  seed_start: 100              # Episode i dùng seed (100 + i): tách biệt với train seeds
