# configs/ppo_low.yaml
# Cấu hình thí nghiệm PPO với mức phạt va chạm THẤP (-1).
# Giả thuyết: agent học ít tránh va chạm hơn, tốc độ cao hơn.
#
# QUAN TRỌNG về normalize_reward=false:
#   Reward mỗi bước nằm trong khoảng [-1, 0.5] (không chuẩn hóa về [0,1]).
#   Điều này cho phép so sánh công bằng: chỉ collision_reward thay đổi,
#   các thành phần reward dương giống hệt nhau giữa 3 config PPO.
#   mean_reward chỉ có ý nghĩa khi so sánh TRONG CÙNG config này.

meta:
  name: "ppo_low"
  description: "PPO with low collision penalty (collision_reward=-1)"

env:
  id: "highway-v0"
  # --- Reward components ---
  collision_reward: -1.0        # ← BIẾN ĐỘC LẬP: mức phạt THẤP
  right_lane_reward: 0.1        # Giống nhau giữa 3 config
  high_speed_reward: 0.4        # Giống nhau giữa 3 config
  lane_change_reward: 0.0
  normalize_reward: false       # TẮT normalize (xem lý do ở reward-analysis.md)
  reward_speed_range: [20, 30]
  # --- Môi trường (giống nhau giữa 3 config) ---
  lanes_count: 4
  vehicles_count: 50
  duration: 40
  ego_spacing: 2
  vehicles_density: 1
  offroad_terminal: false
  # --- Observation ---
  observation:
    type: "Kinematics"
    vehicles_count: 5
    features: ["presence", "x", "y", "vx", "vy"]
    normalize: true

train:
  total_timesteps: 100000       # Số bước train đầy đủ
  seeds: [0, 1, 2]              # 3 seeds → tính mean ± std
  # PPO hyperparameters (SB3 defaults, tốt cho highway-env trên CPU)
  algorithm: "PPO"
  policy: "MlpPolicy"
  n_steps: 256                  # Số bước thu thập trước mỗi lần update
  batch_size: 64
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.99                   # Discount factor
  gae_lambda: 0.95              # GAE lambda cho advantage estimation
  clip_range: 0.2               # PPO clip range
  ent_coef: 0.01                # Entropy coefficient (khuyến khích exploration)
  verbose: 1

eval:
  n_episodes: 50
  seed_start: 100               # Episode i dùng seed (100 + i)
